<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>iOS 27 · Liquid Glass Launcher</title>
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  --glass: rgba(255,255,255,.10);
  --glass-strong: rgba(255,255,255,.16);
  --stroke: rgba(255,255,255,.22);
  --stroke-soft: rgba(255,255,255,.12);
  --ink: #f4f6fb;
  --ink-dim: rgba(244,246,251,.62);
  --blur: 30px;
  --sat: 170%;
  --icon: 64px;
  --gap: 18px;
  --page-pad: 22px;
  --ease: cubic-bezier(.22,1,.36,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:#05060a;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}

/* ============================================================
   Wallpaper — layered mesh gradient, parallax target
   ============================================================ */
.wallpaper{
  position:fixed; inset:-6%;
  z-index:0;
  background:
    radial-gradient(52% 42% at 18% 12%, rgba(124,77,255,.62) 0%, transparent 62%),
    radial-gradient(46% 40% at 86% 18%, rgba(38,110,255,.55) 0%, transparent 58%),
    radial-gradient(58% 48% at 74% 88%, rgba(255,94,120,.36) 0%, transparent 60%),
    radial-gradient(40% 34% at 30% 78%, rgba(0,224,198,.22) 0%, transparent 60%),
    linear-gradient(165deg,#101228 0%,#080a16 55%,#04050a 100%);
  filter:saturate(115%);
  transition:transform .55s var(--ease);
  will-change:transform;
}
.wallpaper::after{ /* soft grain so the blur has something to chew on */
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.10) .5px, transparent .5px);
  background-size:3px 3px;
  opacity:.35; mix-blend-mode:overlay;
}
.vignette{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(0,0,0,.55) 100%);
}

/* ============================================================
   Status bar + Dynamic Island
   ============================================================ */
.statusbar{
  position:fixed; top:0; left:0; right:0; z-index:6;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 28px 0;
  font-size:14px; font-weight:600; letter-spacing:.2px;
  pointer-events:none;
}
.statusbar .right{display:flex; gap:6px; align-items:center; font-size:13px; opacity:.95}
.bars{display:inline-flex; gap:2px; align-items:flex-end; height:10px}
.bars i{width:3px; background:currentColor; border-radius:1px; display:block}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:10px}
.battery{
  width:23px;height:11px;border:1.4px solid rgba(255,255,255,.7);
  border-radius:3.5px;position:relative;
}
.battery::before{content:"";position:absolute;inset:1.5px;width:70%;
  background:#fff;border-radius:1.5px}
.battery::after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:5px;
  background:rgba(255,255,255,.6);border-radius:0 1px 1px 0}

.island{
  position:fixed; top:11px; left:50%; transform:translateX(-50%);
  width:112px; height:32px; border-radius:20px;
  background:#000; z-index:7;
  box-shadow:0 2px 14px rgba(0,0,0,.6), inset 0 0 0 .5px rgba(255,255,255,.08);
  display:flex; align-items:center; justify-content:flex-end; padding-right:12px;
}
.island-dot{width:8px;height:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #2a3a58, #060a14 70%);
  box-shadow:inset 0 0 0 1px rgba(120,160,255,.35)}

/* ============================================================
   Pages + parallax
   ============================================================ */
.viewport{position:fixed; inset:0; z-index:3; overflow:hidden; touch-action:pan-y}
.pages{display:flex; height:100%; width:200%;
  transition:transform .5s var(--ease); will-change:transform}
.page{
  width:50%; height:100%;
  padding:78px var(--page-pad) 198px;
  overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:none;
}
.page::-webkit-scrollbar{display:none}

/* ============================================================
   Glass primitives
   ============================================================ */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  backdrop-filter:blur(var(--blur)) saturate(var(--sat));
  border:.5px solid var(--stroke);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.25),
    inset 0 -1px 0 rgba(255,255,255,.06),
    0 18px 40px rgba(0,0,0,.38);
}

/* ============================================================
   Grid — 4 columns, squircle icons
   ============================================================ */
.grid{
  padding-bottom:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:var(--gap) 10px;
  align-items:start;
}
.app{
  display:flex; flex-direction:column; align-items:center; gap:7px;
  cursor:pointer; position:relative;
  transition:transform .18s var(--spring), opacity .25s ease;
}
.app:active{transform:scale(.9)}
.app-icon{
  width:var(--icon); height:var(--icon);
  border-radius:23%; /* Apple squircle */
  display:grid; place-items:center;
  font-size:30px; line-height:1;
  position:relative; overflow:hidden;
  border:.5px solid rgba(255,255,255,.28);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.45),
    inset 0 -10px 20px rgba(0,0,0,.28),
    0 8px 18px rgba(0,0,0,.35);
  transition:filter .35s ease, transform .25s var(--spring), opacity .25s ease;
}
.app-icon::after{ /* glass sheen */
  content:""; position:absolute; inset:0;
  background:linear-gradient(150deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.08) 38%, transparent 62%);
  pointer-events:none;
}
.app-label{
  font-size:11px; letter-spacing:.1px; color:var(--ink);
  text-shadow:0 1px 3px rgba(0,0,0,.55);
  max-width:76px; text-align:center;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.slot-empty{visibility:hidden} /* invisible icon = empty space */

/* ---- Jiggle mode ---- */
.grid.jiggle .app{animation:jiggle .32s ease-in-out infinite alternate}
.grid.jiggle .app:nth-child(3n){animation-duration:.29s; animation-delay:.04s}
.grid.jiggle .app:nth-child(4n){animation-duration:.36s; animation-delay:.08s}
@keyframes jiggle{
  from{transform:rotate(-1.15deg) translateY(-.4px)}
  to{transform:rotate(1.15deg) translateY(.4px)}
}
.remove{
  position:absolute; top:-6px; left:calc(50% - var(--icon)/2 - 6px);
  width:22px; height:22px; border-radius:50%;
  background:rgba(28,28,32,.92);
  border:.5px solid rgba(255,255,255,.35);
  color:#fff; font-size:15px; font-weight:700; line-height:1;
  display:none; place-items:center; z-index:2;
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.grid.jiggle .remove{display:grid}
.app.removed{opacity:0; pointer-events:none; transform:scale(.6)}

/* ============================================================
   Widget 2x4 (spans 4 cols × 2 rows)
   ============================================================ */
.widget{
  grid-column:span 4;
  border-radius:30px;
  padding:16px;
  margin-bottom:20px;
  position:relative; overflow:hidden;
}
.widget::before{
  content:""; position:absolute; inset:-40% -20% auto;
  height:120%;
  background:radial-gradient(50% 60% at 30% 0%, rgba(255,255,255,.18), transparent 70%);
  pointer-events:none;
}
.widget-eyebrow{
  font-size:10.5px; text-transform:uppercase; letter-spacing:1.4px;
  color:var(--ink-dim); margin-bottom:3px;
}
.widget-title{font-size:19px; font-weight:600; letter-spacing:-.2px; margin-bottom:14px}

.quick{
  display:flex; align-items:center; gap:12px;
  width:100%; border:0; color:var(--ink);
  background:rgba(255,255,255,.09);
  border:.5px solid rgba(255,255,255,.16);
  border-radius:20px; padding:11px 13px; margin-bottom:9px;
  font:inherit; text-align:left; cursor:pointer;
  transition:transform .16s var(--spring), background .2s ease, box-shadow .2s ease;
}
.quick:active, .quick.press{
  transform:scale(.965);
  background:rgba(255,255,255,.2);
  box-shadow:0 0 0 1px rgba(255,255,255,.28) inset, 0 6px 18px rgba(0,0,0,.3);
}
.quick .avatar{
  width:34px; height:34px; border-radius:50%;
  display:grid; place-items:center; font-size:14px; font-weight:700;
  background:linear-gradient(140deg,#7c4dff,#2f6bff);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
}
.quick-label{display:flex; flex-direction:column; line-height:1.25; min-width:0}
.quick-label strong{font-size:14px; font-weight:600}
.quick-label small{font-size:11px; color:var(--ink-dim)}
.quick .chev{margin-left:auto; opacity:.45; font-size:16px}

.quick-row{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.tile{
  flex-direction:column; align-items:flex-start; gap:8px;
  margin:0; padding:13px; border-radius:20px; min-height:78px;
}
.tile .glyph{font-size:19px; line-height:1}
.tile .tile-label{font-size:12px; font-weight:600; letter-spacing:.1px}
.tile .tile-sub{font-size:10.5px; color:var(--ink-dim)}
.tile.on{background:rgba(64,160,255,.28); border-color:rgba(140,200,255,.45)}

/* ============================================================
   Dock + pager
   ============================================================ */
.dock{
  position:fixed; left:14px; right:14px; bottom:26px; z-index:5;
  border-radius:32px; padding:12px 14px;
  display:flex; justify-content:space-around; align-items:center;
}
.dock .app-icon{width:56px;height:56px;font-size:26px;border-radius:24%}
.dock .app-label{display:none}
.pager{
  position:fixed; bottom:12px; left:0; right:0; z-index:5;
  display:flex; gap:7px; justify-content:center; pointer-events:none;
}
.pager i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.32);
  transition:background .25s ease, transform .25s ease}
.pager i.on{background:#fff; transform:scale(1.15)}

/* ============================================================
   Appearance toggle (dark tint) + toast
   ============================================================ */
.appearance{
  position:fixed; right:16px; bottom:96px; z-index:6;
  width:44px; height:44px; border-radius:50%;
  color:var(--ink); font-size:13px; font-weight:600;
  display:grid; place-items:center; cursor:pointer;
  border:.5px solid var(--stroke);
}
body.tinted .app-icon{filter:grayscale(1) brightness(.72) contrast(1.05)}
body.tinted .wallpaper{filter:saturate(.35) brightness(.55)}
body.tinted .widget{background:rgba(255,255,255,.06)}

.toast{
  position:fixed; left:50%; bottom:150px; transform:translate(-50%,14px);
  z-index:9; padding:11px 18px; border-radius:999px;
  background:rgba(20,22,30,.78); border:.5px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  font-size:12.5px; opacity:0; pointer-events:none;
  transition:opacity .22s ease, transform .28s var(--spring);
}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (min-width:520px){
  :root{--icon:72px; --gap:20px}
  .page{padding-left:max(22px, calc((100vw - 460px)/2));
        padding-right:max(22px, calc((100vw - 460px)/2))}
}
</style>
</head>
<body>

<!-- Wallpaper -->
<div class="wallpaper" id="wallpaper"></div>
<div class="vignette"></div>

<!-- Status bar + Dynamic Island -->
<div class="statusbar" aria-hidden="true">
  <span>9:41</span>
  <span class="right">
    <span class="bars"><i></i><i></i><i></i><i></i></span>
    <span style="opacity:.9">5G</span>
    <span class="battery"></span>
  </span>
</div>
<div class="island" aria-hidden="true"><span class="island-dot"></span></div>

<!-- Pages -->
<main class="viewport" id="viewport">
  <div class="pages" id="pages">

    <section class="page" data-page="0">
      <!-- 2×4 interactive widget -->
      <div class="widget glass" role="group" aria-label="Widget raccourcis">
        <div class="widget-eyebrow">Raccourcis</div>
        <div class="widget-title">Bonjour, Alex</div>

        <button class="quick" data-action="call" aria-label="Appeler Alex">
          <span class="avatar">A</span>
          <span class="quick-label"><strong>Appeler Alex</strong><small>Mobile</small></span>
          <span class="chev">›</span>
        </button>

        <div class="quick-row">
          <button class="quick tile" data-action="url">
            <span class="glyph">🌐</span>
            <span class="tile-label">Ouvrir le repo</span>
            <span class="tile-sub">github.com</span>
          </button>
          <button class="quick tile on" data-action="wifi" id="wifiTile">
            <span class="glyph">📶</span>
            <span class="tile-label">Wi‑Fi</span>
            <span class="tile-sub" id="wifiState">Activé</span>
          </button>
        </div>
      </div>

      <div class="grid" id="grid0"></div>
    </section>

    <section class="page" data-page="1">
      <div class="grid" id="grid1"></div>
    </section>

  </div>
</main>

<!-- Dock -->
<nav class="dock glass" id="dock" aria-label="Dock"></nav>

<!-- Pager dots -->
<div class="pager" id="pager"><i class="on"></i><i></i></div>

<!-- Appearance toggle -->
<button class="appearance glass" id="appearance" aria-label="Mode sombre minimaliste">Aa</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   Data
   ============================================================ */
const APPS_PAGE_0 = [
  { name:'Messages', glyph:'💬', c:['#45e07a','#0c8f3f'] },
  { name:'Mail',      glyph:'✉️', c:['#5ac8fa','#0a63c9'] },
  { name:'Photos',    glyph:'🌼', c:['#ffd25f','#ff5f6d'] },
  { name:'Camera',    glyph:'📷', c:['#9aa3b2','#3b4252'] },
  { name:'Calendrier',glyph:'📅', c:['#ff6b6b','#c2185b'] },
  { name:'Météo',     glyph:'⛅', c:['#45aaf2','#2d5be3'] },
  { name:'Horloge',   glyph:'⏰', c:['#2d3436','#000000'] },
  { name:'Réglages',  glyph:'⚙️', c:['#8e9aaf','#4a5468'] },
  { name:'Musique',   glyph:'🎵', c:['#fa5f8f','#b3165c'] },
  { name:'Podcasts',  glyph:'🎙️', c:['#b06cff','#5b2a86'] },
  { name:'Notes',     glyph:'📝', c:['#ffe680','#e0a800'] },
  { name:'Santé',     glyph:'❤️', c:['#ff7b8a','#c9184a'] },
];

const APPS_PAGE_1 = [
  { name:'Plans',     glyph:'🗺️', c:['#7ed957','#1f7a3a'] },
  { name:'Wallet',    glyph:'💳', c:['#4b5563','#111827'] },
  { name:'Fichiers',  glyph:'📁', c:['#58a6ff','#1f4fd8'] },
  { name:'Rappels',   glyph:'✅', c:['#ffffff','#9aa3b2'] },
  { name:'Livres',    glyph:'📚', c:['#ffb703','#e07a00'] },
  { name:'Traduction',glyph:'🈯', c:['#3ddc97','#0b7a5a'] },
  { name:'Raccourcis',glyph:'⚡️', c:['#6d6dff','#2b2bd6'] },
  { name:'Podcasts+', glyph:'🎧', c:['#ff8fab','#a01a4f'] },
];

const DOCK = [
  { name:'Téléphone', glyph:'📞', c:['#4ade80','#12803f'] },
  { name:'Safari',    glyph:'🧭', c:['#5ac8fa','#1b6fd6'] },
  { name:'Messages',  glyph:'💬', c:['#45e07a','#0c8f3f'] },
  { name:'Musique',   glyph:'🎵', c:['#fa5f8f','#b3165c'] },
];

/* Empty slots keep the grid rhythm but stay invisible. */
const EMPTY_SLOTS = { 0:[5,11], 1:[3,6] };

/* ============================================================
   Rendering
   ============================================================ */
const $ = (sel, root=document) => root.querySelector(sel);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function iconMarkup(app){
  return `
    <button class="remove" aria-label="Retirer ${app.name}">−</button>
    <span class="app-icon" style="background:linear-gradient(150deg, ${app.c[0]}, ${app.c[1]})">
      <span aria-hidden="true">${app.glyph}</span>
    </span>
    <span class="app-label">${app.name}</span>`;
}

function renderGrid(el, apps, pageIndex){
  const empties = EMPTY_SLOTS[pageIndex] || [];
  let html = '';
  let appIndex = 0;
  const total = apps.length + empties.length;
  for (let slot = 0; slot < total; slot++){
    if (empties.includes(slot)){
      html += `<div class="slot-empty" aria-hidden="true">${iconMarkup({name:'',glyph:'',c:['#000','#000']})}</div>`;
    } else {
      const app = apps[appIndex++];
      html += `<div class="app" data-name="${app.name}" tabindex="0" role="button">${iconMarkup(app)}</div>`;
    }
  }
  el.innerHTML = html;
}

renderGrid($('#grid0'), APPS_PAGE_0, 0);
renderGrid($('#grid1'), APPS_PAGE_1, 1);

$('#dock').innerHTML = DOCK.map(app =>
  `<div class="app" data-name="${app.name}">${iconMarkup(app)}</div>`).join('');

/* ============================================================
   Toast helper
   ============================================================ */
let toastTimer;
function toast(message){
  const el = $('#toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ============================================================
   Widget actions — press animation then action
   ============================================================ */
let wifiOn = true;

function flash(el){
  el.classList.add('press');
  setTimeout(() => el.classList.remove('press'), 180);
}

document.querySelectorAll('.quick').forEach(btn => {
  btn.addEventListener('click', () => {
    flash(btn);
    const action = btn.dataset.action;
    if (action === 'call'){
      toast('Appel vers Alex…');
      setTimeout(() => { location.href = 'tel:+33600000000'; }, 140);
    }
    if (action === 'url'){
      toast('Ouverture du dépôt GitHub…');
      setTimeout(() => window.open('https://github.com/Logane228/dynamic-island', '_blank'), 160);
    }
    if (action === 'wifi'){
      wifiOn = !wifiOn;
      const tile = $('#wifiTile');
      tile.classList.toggle('on', wifiOn);
      $('#wifiState').textContent = wifiOn ? 'Activé' : 'Désactivé';
      toast(wifiOn ? 'Wi‑Fi activé' : 'Wi‑Fi désactivé');
    }
  });
});

/* ============================================================
   Pages — swipe, pills, parallax
   ============================================================ */
const pages = $('#pages');
const viewport = $('#viewport');
const pager = $('#pager');
const wallpaper = $('#wallpaper');
let pageIndex = 0;
let dragStartX = 0, dragStartY = 0, dragging = false, dragDx = 0, lockedAxis = null;

function setPage(index, animate = true){
  pageIndex = Math.max(0, Math.min(1, index));
  pages.style.transition = animate && !reduceMotion ? 'transform .5s var(--ease)' : 'none';
  pages.style.transform = `translateX(${-pageIndex * 50}%)`;
  [...pager.children].forEach((dot, i) => dot.classList.toggle('on', i === pageIndex));
  updateParallax(0);
}

function updateParallax(offsetPx){
  // background drifts slower than the content → depth
  const vw = window.innerWidth;
  const shift = -(pageIndex * vw * 0.06) + (offsetPx * 0.12);
  wallpaper.style.transform = `translateX(${shift}px) scale(1.08)`;
}

viewport.addEventListener('pointerdown', e => {
  if (e.target.closest('.widget, .quick, .app, .dock')) return;
  dragging = true; dragStartX = e.clientX; dragStartY = e.clientY; dragDx = 0;
  lockedAxis = null;
});

viewport.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (!lockedAxis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
    lockedAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
  }
  if (lockedAxis !== 'x') return;
  dragDx = dx;
  const vw = window.innerWidth;
  const base = -pageIndex * vw;
  const clamped = Math.max(-vw * 1.2, Math.min(vw * 1.2, base + dx));
  pages.style.transition = 'none';
  pages.style.transform = `translateX(${clamped}px)`;
  updateParallax(dx);
});

function endDrag(){
  if (!dragging) return;
  dragging = false;
  const threshold = window.innerWidth * 0.18;
  if (dragDx < -threshold) setPage(pageIndex + 1);
  else if (dragDx > threshold) setPage(pageIndex - 1);
  else setPage(pageIndex);
  dragDx = 0; lockedAxis = null;
}
viewport.addEventListener('pointerup', endDrag);
viewport.addEventListener('pointercancel', endDrag);

/* ============================================================
   Jiggle mode
   ============================================================ */
let jiggle = false;
let longPressTimer;

function enterJiggle(){
  if (jiggle) return;
  jiggle = true;
  document.querySelectorAll('.grid').forEach(g => g.classList.add('jiggle'));
  toast('Mode édition — appuyez sur − pour retirer une icône');
}

function exitJiggle(){
  if (!jiggle) return;
  jiggle = false;
  document.querySelectorAll('.grid').forEach(g => g.classList.remove('jiggle'));
}

document.addEventListener('pointerdown', e => {
  const app = e.target.closest('.app');
  if (!app || e.target.classList.contains('remove')) return;
  longPressTimer = setTimeout(enterJiggle, 480);
}, true);
document.addEventListener('pointerup', () => clearTimeout(longPressTimer), true);
document.addEventListener('pointermove', () => clearTimeout(longPressTimer), true);

document.addEventListener('click', e => {
  const remove = e.target.closest('.remove');
  if (remove){
    const app = remove.closest('.app');
    app.classList.add('removed');
    setTimeout(() => { app.style.display = 'none'; }, 240);
    toast('Icône retirée de la page');
    return;
  }
  if (jiggle && !e.target.closest('.app, .widget, .dock, .appearance')){
    exitJiggle();
  }
});

/* ============================================================
   Appearance — minimal dark tint
   ============================================================ */
$('#appearance').addEventListener('click', () => {
  document.body.classList.toggle('tinted');
  toast(document.body.classList.contains('tinted')
    ? 'Mode sombre · icônes atténuées'
    : 'Apparence standard');
});
